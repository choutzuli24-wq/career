<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>校園活動救援計畫｜ABCDE抽籤器</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:#243d34;font-family:system-ui,'Microsoft JhengHei',sans-serif}main{max-width:850px;margin:auto;padding:30px 18px;text-align:center}h1{font-size:clamp(24px,5vw,42px);margin:10px 0}p{line-height:1.6}.screen{background:#243d34;color:white;border-radius:20px;padding:24px;min-height:250px;display:grid;align-content:center;gap:8px}.letter{font-size:clamp(65px,15vw,130px);font-weight:800;color:#f5e6af;line-height:1.1}.task{font-size:clamp(20px,4vw,34px);font-weight:bold}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:15px 22px;font-weight:bold}.draw{background:#243d34;color:white;width:100%;margin:18px 0;font-size:24px}.draw:disabled{opacity:.6}.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.count{background:white;border:1px solid #d6d9cf;border-radius:12px;padding:12px 4px}.count strong{display:block;font-size:30px}.count small{display:block;font-size:12px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px}.secondary{background:#e0e5da;color:#243d34}.history{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}.history span{background:white;border-radius:6px;padding:5px 9px}button:focus-visible{outline:3px solid #b28a42;outline-offset:3px}@media(max-width:450px){main{padding:15px 10px}.count small{font-size:10px}.foot{flex-wrap:wrap}}</style></head><body><main><small>EVENT RESCUE · WEEK 03</small><h1>校園活動救援計畫</h1><p>ABCDE 課堂抽籤器｜一人一組・允許重複抽中</p><section class="screen" aria-live="polite"><div>你的活動任務</div><div class="letter" id="letter">A B C D E</div><div class="task" id="task">準備抽取任務</div><div id="name"></div></section><button class="draw" id="draw">隨機抽取任務</button><div class="counts" id="counts"></div><div class="foot"><span id="total">已抽籤 0 人</span><div><button class="secondary" id="full">全螢幕</button> <button class="secondary" id="reset">重新開始</button></div></div><details><summary>查看抽籤順序</summary><div class="history" id="history"></div></details><p><small>請記下抽中的字母，依照簡報中的活動資料完成個人作業單。</small></p></main><script>const tasks=[['A','校園演唱會','青春不插電'],['B','校園文創市集','日常製造所'],['C','互動藝術展覽','情緒有形'],['D','藝術手作工作坊','紙的第二人生'],['E','藝文職涯講座','藝術之外的工作']];let history=[];const $=id=>document.getElementById(id);function render(){let t=history.length?tasks[history.at(-1)]:null;$('letter').textContent=t?t[0]:'A B C D E';$('task').textContent=t?t[1]:'準備抽取任務';$('name').textContent=t?t[2]:'';$('total').textContent=`已抽籤 ${history.length} 人`;$('counts').innerHTML=tasks.map((a,i)=>`<div class="count">${a[0]}<strong>${history.filter(x=>x===i).length}</strong><small>${a[1]}</small></div>`).join('');$('history').innerHTML=history.map((x,i)=>`<span>${i+1}. ${tasks[x][0]}</span>`).join('')} $('draw').onclick=()=>{history.push(Math.floor(Math.random()*5));render()};$('reset').onclick=()=>{if(!history.length||confirm('確定清除所有抽籤紀錄？')){history=[];render()}};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('此瀏覽器不支援全螢幕，可使用瀏覽器的全螢幕功能。')}};render();</script></body></html>
